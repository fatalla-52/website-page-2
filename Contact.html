<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milktea Recipe & Contact</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 10px;
    display: flex;
    justify-content: center;
}

   .container {
    max-width: 900px;
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
}
    h2 {
        font-size: 40px;
        font-weight: bold;
        justify-content: center;
        padding: 0px;
    }
    section {
    padding: 20px;
}
    .nav {
        display: flex;
        justify-content: flex-end;
        gap: 20px;
        padding: 18px 25px;
        font-size: 18px;
        font-weight: bold;
        flex-wrap: wrap;
    }

.card {
    background-color: #ffffff;
    padding: 15px;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    flex: 1;
}

.card-image {
    width: 100%;
    height: auto;
    border-radius: 5px;
    margin-bottom: 10px;
}

.card ul {
    list-style-type: none;
    padding: 0;
    margin: 0;
}

.card li {
    margin-bottom: 5px;
    font-size: 0.9rem;
}

.recipe-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.bottom-section {
    background-color: #c7c1a5; 
}

.contact-content {
    display: flex;
    gap: 20px;
}

.contact-info, .contact-form {
    flex: 1;
}

.contact-info p {
    margin: 0 0 10px 0;
}

form label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

form input, form textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box
}

form button {
    background-color: #4a90e2; 
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    float: right
}

form button:hover {
    background-color: #357ABD;
}
    </style>
</head> 
    <nav class="navigator">
    <a href="home.html">Home</a>
    <a href="learn.html">Learn</a>
    <a>Contact</a>
   </nav>
<body>
    <div class="container">

 <section class="bottom-section">
     <header>
         <h2>Contact Us</h2>
 </header>
           

            <div class="contact-content">

                <div class="contact-info">
                    <p><strong>Email:</strong> anglefatalla@gmail.com</p>
                    <p><strong>Phone No:</strong> 09623428152</p>
                    <p><strong>Address:</strong> Sara Smile, 123 Giggle Ave, Richmond, VA 22548</p>
                </div>

                <div class="contact-form">
                    <form>
                        <label for="full-name">Full Name:</label>
                        <input type="text" id="full-name" name="full-name">

                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">

                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="4"></textarea>

                        <button type="submit">Send</button>
                    </form>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
